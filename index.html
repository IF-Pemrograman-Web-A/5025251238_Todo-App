<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>ToDo-app</title>
		<link href="css/style.css" rel="stylesheet">
		<script src="script.js" defer></script>
	</head>

	<body>
		<header>
			<h1>ToDo-app</h1>
		</header>
		<main class="wrapper">
			<section class="todo-list-panel">
				<h2>To-do list</h2>
				<div class="input">
					<form id="add-form">
						<input type="text" id="add-input" placeholder="Add your todo" class="todo-input" autocomplete="off">
						<button class="btn" type="submit">Add todo</button>
					</form>
				</div>
				<ul id="todo-list"></ul>
			</section>
			<section class="todo-editor-panel">
				<h2>Todo Editor</h2>
				<div class="input">
					<form id="editor-form">
						<input type="text" id="editor-input" placeholder="Select a todo to edit" class="todo-input" autocomplete="off" disabled>
						<button class="btn" id="editor-save" type="submit" disabled>Save</button>
					</form>
				</div>
				<p id="editor-hint" class="hint">Click "Edit" on a todo to change its text here.</p>
			</section>
		</main>
	</body>
</html>
