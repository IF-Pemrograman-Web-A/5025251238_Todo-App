<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Offline - ToDo-app</title>
		<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<main style="max-width:480px;margin:10vh auto">
			<section>
				<h1>You're offline</h1>
				<p style="margin:12px 0 20px">This page hasn't been saved yet. Reconnect to load it, or go back to a page you've already opened.</p>
				<button class="btn" onclick="location.reload()">Try again</button>
			</section>
		</main>
	</body>
</html>
